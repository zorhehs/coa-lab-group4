<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C9CDD4"/>
    </marker>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#F5B942"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#141518"/>
  <text x="24" y="30" fill="#F5B942" font-size="14" letter-spacing="3">CACHE-SIM · BLOCK DIAGRAM</text>
  <text x="24" y="48" fill="#7E8591" font-size="11">P07 Configurable Cache Memory Simulator — Group 04</text>

  <!-- inputs -->
  <rect x="24" y="80" width="150" height="54" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="36" y="102" fill="#C9CDD4">TRACE FILE</text>
  <text x="36" y="120" fill="#7E8591" font-size="10">R/W · Dinero · lackey</text>
  <rect x="24" y="150" width="150" height="54" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="36" y="172" fill="#C9CDD4">TRACE GENERATOR</text>
  <text x="36" y="190" fill="#7E8591" font-size="10">seq · loop · random · matrix</text>
  <rect x="24" y="220" width="150" height="54" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="36" y="242" fill="#C9CDD4">CACHE CONFIG</text>
  <text x="36" y="260" fill="#7E8591" font-size="10">C · B · A · policies</text>

  <!-- engine box -->
  <rect x="220" y="70" width="400" height="300" fill="#17181C" stroke="#3A3E48" stroke-dasharray="4 3"/>
  <text x="232" y="90" fill="#F5B942" font-size="11" letter-spacing="2">SIMULATION ENGINE (core.py)</text>

  <rect x="240" y="104" width="150" height="46" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="252" y="124" fill="#C9CDD4">PARSER</text>
  <text x="252" y="140" fill="#7E8591" font-size="10">(op, address) list</text>

  <rect x="240" y="170" width="150" height="46" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="252" y="190" fill="#C9CDD4">ADDRESS DECODE</text>
  <text x="252" y="206" fill="#7E8591" font-size="10">tag | index | offset</text>

  <rect x="240" y="236" width="150" height="46" fill="#1C1E23" stroke="#F5B942"/>
  <text x="252" y="256" fill="#F5B942">CACHE ARRAY</text>
  <text x="252" y="272" fill="#7E8591" font-size="10">S sets × A ways, V/D/tag</text>

  <rect x="240" y="302" width="150" height="46" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="252" y="322" fill="#C9CDD4">REPLACEMENT</text>
  <text x="252" y="338" fill="#7E8591" font-size="10">LRU · FIFO · RANDOM</text>

  <rect x="450" y="104" width="150" height="46" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="462" y="124" fill="#C9CDD4">WRITE POLICY</text>
  <text x="462" y="140" fill="#7E8591" font-size="10">WB/WT · alloc/no-alloc</text>

  <rect x="450" y="170" width="150" height="46" fill="#1C1E23" stroke="#B388EB"/>
  <text x="462" y="190" fill="#B388EB">SHADOW FA CACHE</text>
  <text x="462" y="206" fill="#7E8591" font-size="10">3C classifier</text>

  <rect x="450" y="236" width="150" height="46" fill="#1C1E23" stroke="#5DADE2"/>
  <text x="462" y="256" fill="#5DADE2">VICTIM CACHE</text>
  <text x="462" y="272" fill="#7E8591" font-size="10">extension, FA FIFO</text>

  <rect x="450" y="302" width="150" height="46" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="462" y="322" fill="#C9CDD4">STATS + EVENTS</text>
  <text x="462" y="338" fill="#7E8591" font-size="10">per access snapshot</text>

  <!-- arrows into engine -->
  <line x1="174" y1="107" x2="238" y2="122" stroke="#C9CDD4" marker-end="url(#arr)"/>
  <line x1="174" y1="177" x2="238" y2="132" stroke="#C9CDD4" marker-end="url(#arr)"/>
  <line x1="174" y1="247" x2="238" y2="258" stroke="#F5B942" marker-end="url(#arrA)"/>
  <!-- inside engine -->
  <line x1="315" y1="150" x2="315" y2="168" stroke="#C9CDD4" marker-end="url(#arr)"/>
  <line x1="315" y1="216" x2="315" y2="234" stroke="#C9CDD4" marker-end="url(#arr)"/>
  <line x1="315" y1="282" x2="315" y2="300" stroke="#C9CDD4" marker-end="url(#arr)"/>
  <line x1="390" y1="259" x2="448" y2="259" stroke="#5DADE2" marker-end="url(#arr)"/>
  <line x1="390" y1="250" x2="448" y2="200" stroke="#B388EB" marker-end="url(#arr)"/>
  <line x1="390" y1="245" x2="448" y2="135" stroke="#C9CDD4" marker-end="url(#arr)"/>
  <line x1="525" y1="282" x2="525" y2="300" stroke="#C9CDD4" marker-end="url(#arr)"/>
  <line x1="390" y1="325" x2="448" y2="325" stroke="#C9CDD4" marker-end="url(#arr)"/>

  <!-- main memory -->
  <rect x="660" y="104" width="210" height="60" fill="#1C1E23" stroke="#E8584F"/>
  <text x="672" y="126" fill="#E8584F">MAIN MEMORY (model)</text>
  <text x="672" y="144" fill="#7E8591" font-size="10">block fetch · write-back · write-thru</text>
  <line x1="600" y1="127" x2="658" y2="127" stroke="#E8584F" marker-end="url(#arr)"/>
  <line x1="600" y1="259" x2="658" y2="150" stroke="#E8584F" marker-end="url(#arr)"/>

  <!-- outputs -->
  <rect x="660" y="236" width="210" height="52" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="672" y="256" fill="#C9CDD4">METRICS</text>
  <text x="672" y="274" fill="#7E8591" font-size="10">hit/miss · 3C · traffic · AMAT</text>
  <line x1="600" y1="325" x2="658" y2="270" stroke="#C9CDD4" marker-end="url(#arr)"/>

  <!-- front ends -->
  <rect x="220" y="410" width="190" height="110" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="232" y="432" fill="#F5B942" letter-spacing="2">CLI (cli.py)</text>
  <text x="232" y="452" fill="#C9CDD4" font-size="11">run · decode · gen</text>
  <text x="232" y="468" fill="#C9CDD4" font-size="11">sweep → CSV / SVG</text>
  <text x="232" y="484" fill="#C9CDD4" font-size="11">serve</text>
  <text x="232" y="506" fill="#7E8591" font-size="10">experiments.py → results/</text>

  <rect x="450" y="410" width="420" height="110" fill="#1C1E23" stroke="#2A2D34"/>
  <text x="462" y="432" fill="#F5B942" letter-spacing="2">WEB GUI (server.py + web/)</text>
  <text x="462" y="452" fill="#C9CDD4" font-size="11">JSON API: /simulate /sweep /decode /generate</text>
  <text x="462" y="468" fill="#C9CDD4" font-size="11">address decode · cache array animation · counters</text>
  <text x="462" y="484" fill="#C9CDD4" font-size="11">step / play transport · access log · sweeps + charts</text>
  <text x="462" y="506" fill="#7E8591" font-size="10">replays per-access events; no cache logic in the browser</text>

  <line x1="315" y1="370" x2="315" y2="408" stroke="#C9CDD4" marker-end="url(#arr)"/>
  <line x1="525" y1="370" x2="525" y2="408" stroke="#C9CDD4" marker-end="url(#arr)"/>
  <text x="330" y="392" fill="#7E8591" font-size="10">events + stats</text>
  <text x="540" y="392" fill="#7E8591" font-size="10">events + stats (JSON)</text>
</svg>
